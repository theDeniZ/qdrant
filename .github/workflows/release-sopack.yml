name: Release sopack

# Cut a release by pushing a tag `sopack-v<version>` whose version equals
# __version__ in sopack/__init__.py. The pipeline:
#
#   build    (linux)  version check, unit tests, tarball of sopack/
#   brew     (macOS)  real `brew install` + `brew test` of that tarball through a
#                     throwaway local tap — nothing is published if this fails
#   publish  (linux)  GitHub Release with the tarball, then Formula/sopack.rb on
#                     the default branch gets the new url + sha256
#
# This repository is itself the Homebrew tap (see Formula/README.md), so the
# formula bump is a commit here, not a PR to another repo.

on:
  push:
    tags:
      - "sopack-v*"

concurrency:
  group: release-sopack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches sopack/__init__.py
        id: version
        run: |
          # pyproject.toml reads its version from sopack.__version__, so this
          # is the only place a version lives.
          TAG_VERSION="${GITHUB_REF_NAME#sopack-v}"
          PKG_VERSION=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('sopack/__init__.py').read_text()).group(1))")
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::version mismatch — set __version__ in sopack/__init__.py to $TAG_VERSION, commit, then re-tag"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install exactly as the formula does
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install -r sopack/requirements.lock
          /tmp/venv/bin/pip install --no-deps ./sopack

      - name: Unit tests + CLI smoke
        run: |
          PYTHONPATH=. /tmp/venv/bin/python -m unittest discover -s sopack/tests -p 'test_*.py'
          /tmp/venv/bin/sopack --version | grep -F "${{ steps.version.outputs.version }}"
          # Run from outside the checkout so the INSTALLED package is imported.
          cd /tmp && /tmp/venv/bin/python -c "import sopack.pack, sopack.extract, sopack.doctor"

      - name: Build tarball
        id: tarball
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p dist
          # Tracked files of sopack/ only, under the single top-level dir
          # Homebrew cd's into — the formula expects ./sopack inside it.
          git archive --format=tar.gz --prefix="sopack-$V/" -o "dist/sopack-$V.tar.gz" HEAD sopack
          (cd dist && sha256sum "sopack-$V.tar.gz" > "sopack-$V.tar.gz.sha256")
          cat "dist/sopack-$V.tar.gz.sha256"
          echo "sha256=$(cut -d' ' -f1 "dist/sopack-$V.tar.gz.sha256")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sopack-tarball
          path: dist/

  brew:
    needs: build
    # Apple Silicon + Sonoma: the oldest platform the pinned onnxruntime supports.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sopack-tarball
          path: dist

      - name: Install through a throwaway local tap
        env:
          V: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha256 }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew tap-new --no-git ci/sopack
          TAP="$(brew --repository)/Library/Taps/ci/homebrew-sopack"
          perl -pe "s|^  url \".*\"|  url \"file://$GITHUB_WORKSPACE/dist/sopack-$V.tar.gz\"|; s|^  sha256 \".*\"|  sha256 \"$SHA\"|" \
            Formula/sopack.rb > "$TAP/Formula/sopack.rb"
          brew install --verbose ci/sopack/sopack
          # A failed post_install is only a warning to `brew install`, but it is
          # where the venv gets built — assert it exists before testing.
          test -x "$(brew --prefix)/var/sopack/venv/bin/python" \
            || { echo "::error::post_install did not build the venv"; exit 1; }
          brew test --verbose ci/sopack/sopack
          sopack --version

  publish:
    needs: [build, brew]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sopack-tarball
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: sopack ${{ needs.build.outputs.version }}
          files: |
            dist/sopack-${{ needs.build.outputs.version }}.tar.gz
            dist/sopack-${{ needs.build.outputs.version }}.tar.gz.sha256
          body: |
            ## Install (Apple Silicon, macOS 14+)

            ```bash
            brew tap theDeniZ/qdrant https://github.com/theDeniZ/qdrant   # once
            brew install theDeniZ/qdrant/sopack                            # or: brew upgrade sopack
            sopack doctor
            ```

            sha256 `${{ needs.build.outputs.sha256 }}`

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Point Formula/sopack.rb at this release
        env:
          V: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sopack-$V.tar.gz"
          perl -pi -e "s|^  url \".*\"|  url \"$URL\"|; s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/sopack.rb
          git diff --stat
          if git diff --quiet; then echo "formula already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sopack: formula -> $V"
          git push origin HEAD:${{ github.event.repository.default_branch }}
