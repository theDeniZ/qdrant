# sopack 1.0 — Rust workspace. Plan: ../docs/SOPACK-1.0-PLAN.md
#
# Cargo.lock is committed and pins ort + tokenizers: those two crates (plus the
# ONNX Runtime build they load) define the vector space. Bumping either means
# re-running the calibration gate (contracts/*/calibration.json) — see §6.
[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
sopack-contract = { path = "crates/sopack-contract" }
sopack-format = { path = "crates/sopack-format" }
sopack-book = { path = "crates/sopack-book" }
sopack-extract = { path = "crates/sopack-extract" }
sopack-embed = { path = "crates/sopack-embed" }
sopack-progress = { path = "crates/sopack-progress" }

# Vector-space-defining pins (M0 measured exactly these).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "api-24"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
ndarray = "0.17"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
indicatif = "0.17"
rayon = "1"
uuid = { version = "1", features = ["v5"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
regex = "1"
unicode-normalization = "0.1"
tempfile = "3"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
strip = true
