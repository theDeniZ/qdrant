[package]
name = "sopack-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "M0 go/no-go: Rust (ort + tokenizers) vs stored e5-large vectors"

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "load-dynamic", "std", "api-24"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
debug = false
