[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sopack"
# Single source of truth: sopack/__init__.py (the release workflow checks the tag
# against it).
dynamic = ["version"]
description = "Prepare and verify corpus import packs for the bible-sop Qdrant collections"
requires-python = ">=3.11"
# Runtime deps are deliberately NOT listed here as ranges. The pinned closure in
# requirements.lock is the contract (R7), because the embedding library's exact
# version determines the vector space — see contract.EMBEDDING. Install with:
#   pip install -r requirements.lock && pip install --no-deps .
dependencies = []

[project.scripts]
sopack = "sopack.cli:main"

[tool.setuptools]
# The package directory IS this directory, so it is mapped explicitly and the
# packages are listed rather than discovered: discovery from inside the package
# finds `extract` as a TOP-LEVEL package and never installs `sopack` itself.
package-dir = { "sopack" = "." }
packages = ["sopack", "sopack.extract"]

[tool.setuptools.dynamic]
version = { attr = "sopack.__version__" }

[tool.setuptools.package-data]
sopack = ["schemas/*.json", "requirements.lock"]
