# Pinned dependency closure for the sopack CLI (Python 3.11, macOS/Linux).
#
# This is requirement R7: a missing wheel must fail in seconds, not twenty
# minutes into an embedding run (failures #2 and #3). The closure below was
# RESOLVED, not hand-listed — fastembed alone pulls 11 direct dependencies, and
# an incomplete lock silently installs unpinned versions of the rest, which is
# how a pooling change (#15) gets in without anyone choosing it.
#
# Resolved from /workspaces/sdarm/.venv on 2026-09-22, the same interpreter whose
# fastembed reproduces the live collection's vectors at cosine 1.00000.
#
# Deliberately absent, being platform/version conditionals that do not apply to
# macOS or Linux on Python 3.11:
#   colorama, win32-setctime  (Windows only)
#   aiocontextvars            (Python < 3.7)
#   tomli                     (Python < 3.11)
#
# Add --hash pins at release time:
#   pip install --require-hashes -r requirements.lock
#
# Install:
#   pip install -r sopack/requirements.lock

